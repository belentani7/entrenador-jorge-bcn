name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; else npm install; fi
      - name: Verificar banco de datos
        run: node scripts/validate-catalog.mjs
      - name: Doctor
        run: python scripts/doctor.py
      - name: Build
        run: npm run build --if-present
      - name: Tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v || true; fi
