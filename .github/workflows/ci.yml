permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Auditoría de estructura
        run: python3 scripts/doctor.py
      - name: Validar catálogo
        run: node scripts/validate-catalog.mjs
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Formato
        run: pnpm format:check
      - name: Subir artefacto del frontend
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          if-no-files-found: error
